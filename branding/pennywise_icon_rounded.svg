      <stop offset="1" stop-color="#12693F"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="104" height="104" rx="24" fill="url(#bg)"/>
  <g transform="translate(54 54) scale(0.84) translate(-56 -55)">
  <path fill="#FFFFFF" d="M34,33 a5,5 0 0 1 10,0 L44,77 a5,5 0 0 1 -10,0 Z"/>
